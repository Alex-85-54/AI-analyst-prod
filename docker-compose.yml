x-environment: &environment
  env_file:
    - ./.env

  environment:
  # Telegram
    - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
    # ClickHouse
    - CH_HOST=${CH_HOST}
    - CH_PORT=${CH_PORT}
    - CH_USER=${CH_USER}
    - CH_PASSWORD=${CH_PASSWORD}
    # PostgreSQL
    - PG_HOST=${PG_HOST}
    - PG_PORT=${PG_PORT}
    - PG_USER=${PG_USER}
    - PG_PASSWORD=${PG_PASSWORD}
    - PG_DATABASE=${PG_DATABASE}
    # DeepSeek
    - API_KEY_DEEPSEEK=${API_KEY_DEEPSEEK}
    # OpenAI
    - API_KEY_OPENAI=${API_KEY_OPENAI}
    - OPENAI_MODEL=${OPENAI_MODEL}
    # Proxy
    - PROXY_HOST=${PROXY_HOST}
    - PROXY_PORT=${PROXY_PORT}
    # Security
    - AUTH_CONFIG_PATH=${AUTH_CONFIG_PATH}
    # Logging
    - LOG_FILE_PATH=/app/logs/app.log
    - LOG_LEVEL=INFO
    - LOG_MAX_SIZE_MB=100
    - LOG_BACKUP_COUNT=5
    - LOG_ENABLE_CONSOLE=true
    # Таймауты агента (в .env можно переопределить; после смены — перезапуск контейнера)
    - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-180}
    - AGENT_MAX_EXECUTION_TIME=${AGENT_MAX_EXECUTION_TIME:-600}
    - AGENT_MAX_ITERATIONS=${AGENT_MAX_ITERATIONS:-10}
    - BOT_HANDLER_TIMEOUT=${BOT_HANDLER_TIMEOUT:-660}
    # Кэш моделей HuggingFace (FRIDA): сохраняется на хосте, при перезапуске не качаем заново
    - HF_CACHE_DIR=/app/cache/huggingface
services:
  ai-analyst:
    <<: *environment
    build:
      context: .
      target: prod
    image: your-registry/ai-analyst:${TAG:-latest}
    restart: unless-stopped
    volumes:
      # Модель FRIDA: первый запуск — скачивание в эту папку на хосте, дальше — загрузка с хоста
      - ./cache/huggingface:/app/cache/huggingface
    networks:
      - rees46
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rees46:
    external: false
